<script>
    // 状態管理：一度選ばれた座席の「番号（11や52など）」を記録する配列
    let selectedSeatNumbers = [];

    // 起動時に保存された選出履歴を復元する
    window.onload = function() {
        loadFromLocalStorage();
        const savedHistory = localStorage.getItem('seat_selected_history_custom');
        if (savedHistory) {
            selectedSeatNumbers = JSON.parse(savedHistory);
            // 保存されていた当選席を緑色にする
            selectedSeatNumbers.forEach(num => {
                const seatEl = document.querySelector(`.seat[data-id="${num}"]`);
                if (seatEl) seatEl.classList.add('selected');
            });
        }
        updateStatusMessage();
    };

    // 学年を指定して選出する関数（重複防止版）
    function assignSeats(targetGrade) {
        // 1. 画面内にあるすべての座席を取得
        const allSeats = Array.from(document.querySelectorAll('.seat'));
        
        // 2. 指定された学年、かつ「まだ選ばれていない（.selectedがついていない）」席だけを絞り込む
        const availableSeats = allSeats.filter(seat => {
            const isTargetGrade = seat.getAttribute('data-grade') === String(targetGrade);
            const isNotSelected = !seat.classList.contains('selected');
            return isTargetGrade && isNotSelected;
        });

        // もし候補がなければ終了
        if (availableSeats.length === 0) {
            alert(`${targetGrade}年生の空いている席がもうありません！`);
            return;
        }

        // 3. 残っている候補からランダムに1つ選出
        const randomIndex = Math.floor(Math.random() * availableSeats.length);
        const chosenSeat = availableSeats[randomIndex];
        const chosenId = chosenSeat.getAttribute('data-id');

        // 4. 全体の選択エフェクトを一度消す（直近の当選だけを目立たせる場合）
        // ※もし過去の当選をすべて緑のまま残したい場合は、下のforEachの3行を消してください
        allSeats.forEach(el => el.classList.remove('selected'));

        // 5. 当選した席を確定（緑色にする）し、履歴に記憶
        chosenSeat.classList.add('selected');
        
        // 重複して配列に入らないようにチェックして追加
        if (!selectedSeatNumbers.includes(chosenId)) {
            selectedSeatNumbers.push(chosenId);
        }

        // ローカルストレージに保存
        localStorage.setItem('seat_selected_history_custom', JSON.stringify(selectedSeatNumbers));
        saveToLocalStorage(); // 既存の配置保存関数を呼び出す
        updateStatusMessage();
    }

    // クラス全体の残りをシャッフル（既存の処理に重複防止を連動）
    function shuffleRemaining() {
        // シャッフルする際も一度当選履歴をクリアするかどうか
        // 今回は「選出」の流れを邪魔しないよう、ここをトリガーにしても良いですが、
        // 基本は「リセットボタン」で消すのが安全です。
        alert("残りの席をシャッフルします。");
        // （既存のシャッフル処理がここにあれば、そのまま残して結合してください）
    }

    // ★新機能：選出履歴を完全にまっさらにするリセット関数
    function resetSelection() {
        if (confirm('これまでの選出履歴（緑色の枠）をすべてリセットして、最初からやり直しますか？')) {
            selectedSeatNumbers = [];
            localStorage.removeItem('seat_selected_history_custom');
            
            // 画面上のすべての席から緑色（selectedクラス）を剥がす
            document.querySelectorAll('.seat').forEach(el => {
                el.classList.remove('selected');
            });
            updateStatusMessage();
        }
    }

    // 画面上部に状態を表示する（オプション）
    function updateStatusMessage() {
        const totalSelected = selectedSeatNumbers.length;
        console.log(`現在選出済みの席数: ${totalSelected}席 (${selectedSeatNumbers.join(', ')})`);
    }

    // HTML側の各ボタンの「onclick」にこの関数をバインドしてください
    // 例： <button onclick="assignSeats(1)">1年生を選出</button>
    // 例： <button onclick="assignSeats(2)">2年生を選出</button>
    // 例： <button onclick="assignSeats(3)">3年生を選出</button>
    // 追加するリセットボタン： <button onclick="resetSelection()" style="background:#dc2626;">選出リセット</button>
</script>
